{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">修改密码</h2>
            <p class="text-sm text-gray-500 mt-1">定期修改密码有助于保护您的作业安全</p>
        </div>

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">原密码</label>
                <input type="password" name="old_password" required 
                       class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 focus:bg-white transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">新密码 (至少 6 位)</label>
                <input type="password" name="new_password" required minlength="6"
                       class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 focus:bg-white transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">确认新密码</label>
                <input type="password" name="confirm_password" required minlength="6"
                       class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 focus:bg-white transition-colors">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-xl hover:bg-blue-700 active:scale-[0.98] transition-all shadow-md shadow-blue-500/20">
                确认修改
            </button>
        </form>

        <!-- 忘记原密码提示区 -->
        <div class="mt-8 pt-6 border-t border-gray-100">
            <p class="text-sm font-bold text-gray-800 mb-3 text-center">忘记原密码？</p>
            
            {% if sys_config and sys_config.is_maintenance %}
            <div class="bg-red-50 text-red-600 border border-red-100 rounded-xl p-4 text-sm font-medium text-center">
                <p>系统维护中，密码自助重置服务已暂停。</p>
                <p class="mt-1">如需重置密码，请直接联系系统管理员处理。</p>
            </div>
            {% else %}
            <div class="bg-gray-50 rounded-xl p-4 border border-gray-100 text-left space-y-2.5 shadow-inner">
                <div class="flex items-start">
                    <svg class="w-4 h-4 text-blue-500 mt-0.5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <p class="text-sm text-gray-600">
                        请先 <a href="{{ url_for('logout') }}" class="text-blue-600 font-bold hover:underline">退出登录</a>。
                    </p>
                </div>
                <div class="flex items-start">
                    <svg class="w-4 h-4 text-blue-500 mt-0.5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <p class="text-sm text-gray-600">
                        在登录页点击 <span class="font-bold text-gray-800">【通过绑定邮箱自助重置】</span>，验证身份后即可重置密码。
                    </p>
                </div>
                <div class="flex items-start">
                    <svg class="w-4 h-4 text-gray-400 mt-0.5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <p class="text-xs text-gray-400 mt-0.5">
                        若您未绑定邮箱，请联系系统管理员核实身份后进行人工重置。
                    </p>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
