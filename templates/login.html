{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-20 bg-white p-8 border border-gray-200 shadow-sm rounded-none">
    <h2 class="text-2xl font-semibold mb-6 text-center">系统登录</h2>
    <form method="POST" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm text-gray-600 mb-1">学号 / 工号</label>
            <input type="text" name="username" required class="w-full border border-gray-300 p-2 focus:outline-none focus:border-black">
        </div>
        <div>
            <label class="block text-sm text-gray-600 mb-1">密码</label>
            <input type="password" name="password" required class="w-full border border-gray-300 p-2 focus:outline-none focus:border-black">
        </div>
        <button type="submit" class="w-full bg-black text-white p-3 mt-4 hover:bg-gray-800 transition">登 录</button>
    </form>
</div>
{% endblock %}
